grammar: FHIRConnect/v0.9.0
type: model
metadata:
  name:  CLUSTER.multiple_coding_icd10gm.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.multiple_coding_icd10gm.v1
    revision: 1.1.0
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Coding

mappings:
  - name: "mehrfachcodierungManifestation"
    with:
      fhir: "$fhirRoot.value" #fhir.extension
      openehr: "$archetype/items[at0001]"
      type: "$NONE"
    openehrCondition:
      targetRoot: "$archetype/items[at0001]"
      targetAttribute: "defining_code/code_string"
      operator: "one of"
      criteria: "at0003"
    fhirCondition:
      targetRoot: "$fhirRoot"
      targetAttribute: "code"
      operator: "one of"
      criteria: "*"
    followedBy:
       mapping:
        with:
           fhir: "$fhirRoot"
           openehr: "$openehrRoot"
           type: "$NONE"
        manual:
          - name: "manifestation"
            openehr:
              - path: "defining_code/terminology_id"
                value: "local"
              - path: "defining_code/code_string"
                value: "at0003"
              - path: "value"
                value: "*"
            fhir:
              - path: "code"
                value: "*"
              - path: "display"
                value: "*"
              - path: "system"
                value: "http://fhir.de/ValueSet/icd-10-gm-mehrfachcodierungs-kennzeichen"

  - name: "mehrfachcodierungAtiology"
    with:
      fhir: "$fhirRoot.value" #fhir.extension
      openehr: "$archetype/items[at0001]"
    openehrCondition:
      targetRoot: "$archetype/items[at0001]"
      targetAttribute: "value/defining_code/code_string"
      operator: "one of"
      criteria: "at0002"
    fhirCondition:
      targetRoot: "$fhirRoot"
      targetAttribute: "code"
      operator: "one of"
      criteria: "†"
    manual:
      - name: "ätiology"
        openehr:
          - path: "defining_code/terminology_id"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0002"
          - path: "value"
            value: "†"
        fhir:
          - path: "code"
            value: "†"
          - path: "display"
            value: "†"
          - path: "system"
            value: "http://fhir.de/ValueSet/icd-10-gm-mehrfachcodierungs-kennzeichen"

  - name: "mehrfachcodierungAdditionalInformation"
    with:
      fhir: "$fhirRoot.value" #fhir.extension
      openehr: "$archetype/items[at0001]"
    fhirCondition:
      targetRoot: "$fhirRoot"
      targetAttribute: "code"
      operator: "one of"
      criteria: "!"
    openehrCondition:
      targetRoot: "$archetype/items[at0001]"
      targetAttribute: "value/defining_code/code_string"
      operator: "one of"
      criteria: "at0004"
    manual:
      - name: "additionalInformation"
        openehr:
          - path: "defining_code/terminology_id"
            value: "local"
          - path: "defining_code/code_string"
            value: "at0004"
          - path: "value"
            value: "!"
        fhir:
          - path: "code"
            value: "!"
          - path: "display"
            value: "!"
          - path: "system"
            value: "http://fhir.de/ValueSet/icd-10-gm-mehrfachcodierungs-kennzeichen"